name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests (формулы скора, рейтинга, ансамбля, достоверности)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeteoAnalyst-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
