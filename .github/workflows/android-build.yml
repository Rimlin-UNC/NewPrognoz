name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    name: "Сервер (PHP): синтаксис, схема, e2e API"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка синтаксиса PHP
        run: |
          set -o pipefail
          find server -name '*.php' -print0 | xargs -0 -n1 php -l 2>&1 | tee /tmp/php-lint.log
          echo "Проверено файлов: $(find server -name '*.php' | wc -l)"

      - name: "Схема БД: schema.mysql.sql актуален"
        run: |
          set -o pipefail
          cd server
          php schema_dump.php > /tmp/schema-gen.sql 2>/tmp/schema-gen.err
          diff -u schema.mysql.sql /tmp/schema-gen.sql | tee /tmp/schema.diff
          echo "schema.mysql.sql соответствует Schema.php"

      - name: e2e самотест API (SQLite + встроенный сервер)
        run: |
          cd server
          WA_CONFIG=$(pwd)/tests/config.sqlite.php php -S 127.0.0.1:8099 -t htdocs tests/router.php &
          SERVER_PID=$!
          sleep 2
          set +e
          php tests/api_test.php 2>&1 | tee /tmp/e2e.log
          TEST_RC=${PIPESTATUS[0]}
          kill $SERVER_PID 2>/dev/null || true
          set -e
          exit $TEST_RC

      # Логи недоступны через API из некоторых сред — публикуем выдержку
      # ошибок коммитом в ветку (файл ci-server-errors.txt, [skip ci]).
      - name: Публикация лога при ошибке
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "=== SERVER TESTS FAILED: $GITHUB_RUN_URL ==="
            for f in /tmp/php-lint.log /tmp/schema-gen.err /tmp/schema.diff /tmp/e2e.log; do
              if [ -s "$f" ]; then
                echo "--- $f ---"
                tail -n 120 "$f"
              fi
            done
          } > ci-server-errors.txt
          git add ci-server-errors.txt
          git commit -m "CI: server tests failed [skip ci]" || exit 0
          BRANCH=$(git branch --show-current)
          if [ -z "$BRANCH" ]; then echo "detached HEAD — публикация только в push-сборках"; exit 0; fi
          for i in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort; exit 0; }
            sleep 3
          done
          exit 0

  build:
    name: "Приложение: тесты + Release APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (формулы, профили, синхронизация)
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      - name: Assemble release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-release.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeteoAnalyst-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Логи недоступны через API из некоторых сред — публикуем выдержку
      # ошибок коммитом в ветку (файл ci-last-errors.txt, [skip ci]).
      - name: Publish failure log to branch
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "=== FAILED RUN: $GITHUB_RUN_URL ==="
            echo "--- test log (errors) ---"
            grep -nE "^e: |error:|FAILED|Caused by|FAILURE|BUILD " gradle-test.log | tail -150 || true
            echo "--- test log (tail) ---"
            tail -60 gradle-test.log || true
            echo "--- release log (errors) ---"
            grep -nE "^e: |error:|FAILED|Caused by|FAILURE|BUILD " gradle-release.log | tail -150 || true
            echo "--- release log (tail) ---"
            tail -60 gradle-release.log || true
          } > ci-last-errors.txt
          git add ci-last-errors.txt
          git commit -m "CI: log excerpt [skip ci]" || exit 0
          BRANCH=$(git branch --show-current)
          if [ -z "$BRANCH" ]; then echo "detached HEAD — публикация только в push-сборках"; exit 0; fi
          for i in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH" || { git rebase --abort; exit 0; }
            sleep 3
          done
          exit 0
